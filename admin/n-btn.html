<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/n-btn.css">
</head>
<body>
    <button class="n-btn">filled</button>
    
    <button class="n-btn n-btn:filled">filled</button>
    <button class="n-btn n-btn:elevated">elevated</button>
    <button class="n-btn n-btn:tonal">tonal</button>
    <button class="n-btn n-btn:outline">outline</button>
    <button class="n-btn n-btn:text">text</button>

    <br>
    <br>
    <button class="n-btn n-btn:filled n-btn:size-xs n-btn:shape-round">옵션테스트</button>
    <button class="n-btn n-btn:elevated n-btn:size-xs n-btn:shape-square-xs">옵션테스트</button>
    <button class="n-btn n-btn:tonal n-btn:size-s n-btn:shape-square-s">옵션테스트</button>
    <button class="n-btn n-btn:outline n-btn:size-m n-btn:shape-square-m">옵션테스트</button>
    <button class="n-btn n-btn:filled n-btn:size-l n-btn:shape-square-l">옵션테스트</button>
    <button class="n-btn n-btn:filled n-btn:size-xl n-btn:shape-square-xl">옵션테스트</button>
</body>
</html>
