<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- header -->
    <div>
        <div>NCafe</div>
        <div>공유</div>
    </div>

    <!-- main -->
    <div>
        <div>메뉴 등록</div>
        <div>
            <!-- 제목 -->
            <div>등록 폼</div>
            <!-- 컨텐츠 -->
            <div>
                <!-- 이미지 영역 -->
                <div>
                    <div>
                        메뉴 이미지
                        <input type="file">
                    </div>
                </div>
                <!-- 한글명 영역 -->
                <div>
                    <div>
                        한글명
                        <input type="text">
                    </div>
                </div>
                <!-- 영문명 영역 -->
                <div>
                    <div>
                        영문명
                        <input type="text">
                    </div>
                </div>
                <!-- 카테고리 영역 -->
                <div>
                    <div>
                        카테고리
                        <select>
                            <option>커피</option>
                            <option>쿠키</option>
                            <option>케이크</option>
                        </select>
                    </div>
                </div>
                <!-- 가격 영역 -->
                <div>
                    <div>
                        가격
                        <input type="text">
                    </div>
                </div>
                <!-- 설명 영역 -->
                <div>
                    <div>
                        설명
                        <textarea cols="60" rows="10">
                            설명설명
                        </textarea>
                    </div>
                </div>
                <!-- 옵션 영역 -->
                <div>
                    <div><input type="checkbox"> 판매가능</div>
                    <div><input type="checkbox"> Hot</div>
                    <div><input type="checkbox"> Iced</div>
                </div>
                <!-- 버튼 영역 -->
                <div>
                    <!-- <input type="button" value="저장">
                    <input type="button" value="취소"> -->
                    <button>저장</button>
                    <button>취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- footer -->
    <div>
        <div>대시보드</div>
        <div>메뉴 목록</div>
        <div>메뉴 등록</div>
    </div>

</body>

</html>
